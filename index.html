<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driada — Gestor de Tareas</title>

  <!-- acá conecto el archivo de estilos (tiene que estar en la misma carpeta) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== MENÚ DE ARRIBA ========== -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="#" class="logo">
        <span class="logo-icon">🍃</span>
        Driada
      </a>

      <!-- los href con # llevan a la sección que tiene ese mismo id -->
      <nav class="nav-links">
        <a href="#nueva-tarea">Nueva tarea</a>
        <a href="#tareas">Tareas</a>
        <a href="#estadisticas">Estadísticas</a>
        <a href="#historial">Historial</a>
      </nav>

      <!-- scrollToSection es una función que está en script.js -->
      <button class="btn btn-primary" onclick="scrollToSection('nueva-tarea')">
        Nueva tarea
      </button>
    </div>
  </header>

  <main>

    <!-- ========== PORTADA ========== -->
    <section class="hero">
      <div class="hero-container">
        <h1>PANEL DE CONTROL</h1>

        <div class="hero-actions">
          <button class="btn btn-primary" onclick="scrollToSection('nueva-tarea')">
            Crear primera tarea
          </button>
          <button class="btn btn-secondary" onclick="scrollToSection('tareas')">
            Ver tareas
          </button>
        </div>
      </div>
    </section>

    <!-- ========== FORMULARIO NUEVA TAREA ========== -->
    <section id="nueva-tarea" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Nueva tarea</h2>
        </div>

        <!-- el id "task-form" lo usa el JS para escuchar cuando se envía el formulario -->
        <form id="task-form" class="task-form">
          <div class="form-group">
            <label for="task-title">Título</label>
            <input
              type="text"
              id="task-title"
              placeholder="Ej: Preparar informe mensual"
              required
            >
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="task-priority">Prioridad</label>
              <select id="task-priority" required>
                <option value="Alta">Alta</option>
                <option value="Media" selected>Media</option>
                <option value="Baja">Baja</option>
              </select>
            </div>

            <div class="form-group">
              <label for="task-category">Categoría</label>
              <input
                type="text"
                id="task-category"
                placeholder="Ej: Diseño, Desarrollo, Estudio"
                required
              >
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="task-assignee">Responsable</label>
              <input
                type="text"
                id="task-assignee"
                placeholder="Nombre del responsable"
                required
              >
            </div>

            <div class="form-group">
              <label for="task-deadline">Fecha límite</label>
              <input
                type="date"
                id="task-deadline"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="task-status">Estado</label>
            <select id="task-status" required>
              <option value="pendiente" selected>Pendiente</option>
              <option value="en curso">En curso</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            Guardar tarea
          </button>
        </form>
      </div>
    </section>

    <!-- ========== TAREAS ACTIVAS ========== -->
    <section id="tareas" class="section section-alt">
      <div class="container">
        <div class="section-header">
          <h2>Tareas activas</h2>
          <button class="btn btn-outline-dark" onclick="exportCsv()">
            Exportar CSV
          </button>
        </div>

        <!-- este div arranca vacío, el JS le mete las tarjetas -->
        <div id="task-list" class="task-list"></div>
      </div>
    </section>

    <!-- ========== TAREAS FINALIZADAS ========== -->
    <section id="finalizadas" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Tareas finalizadas</h2>
        </div>

        <!-- también se llena desde el JS -->
        <div id="completed-list" class="completed-list"></div>
      </div>
    </section>

    <!-- ========== ESTADÍSTICAS ========== -->
    <section id="estadisticas" class="section section-alt">
      <div class="container">
        <div class="section-header">
          <h2>Estadísticas</h2>
        </div>

        <!-- los números arrancan en 0 y el JS los actualiza -->
        <div class="stats-grid">
          <article class="stat-card">
            <span class="stat-label">Activas</span>
            <span id="stat-active" class="stat-value">0</span>
          </article>

          <article class="stat-card">
            <span class="stat-label">En curso</span>
            <span id="stat-progress" class="stat-value">0</span>
          </article>

          <article class="stat-card">
            <span class="stat-label">Finalizadas</span>
            <span id="stat-done" class="stat-value">0</span>
          </article>
        </div>
      </div>
    </section>

    <!-- ========== HISTORIAL ========== -->
    <section id="historial" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Historial de eventos</h2>
          <span class="section-tag">Sistema activo</span>
        </div>

        <div id="log-container" class="log-container"></div>
      </div>
    </section>
  </main>

  <!-- ========== PIE DE PÁGINA ========== -->
  <footer class="footer">
    <div class="container footer-container">
      <p class="footer-copy">© 2026 Driada</p>
    </div>
  </footer>

  <!-- el script va al final para que el HTML ya esté cargado cuando corre -->
  <script src="app.js"></script>
</body>
</html>
